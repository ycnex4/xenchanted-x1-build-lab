[package]
name = "xxxl-svm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
phase-41k4-svm-test-harness = []
dangerously-allow-phase-41k4-svm-test-harness-sbf-build = []
phase-41k5-spl-mint-to-cpi-test-gate = []
dangerously-allow-phase-41k5-spl-mint-to-cpi-test-gate-sbf-build = []

[dependencies]
solana-program = "2.3.0"
spl-token = { version = "5.0.2", features = ["no-entrypoint"] }

[dev-dependencies]
mollusk-svm = "0.13.4"
solana-account = "=3.4.0"
solana-instruction = "=3.3.0"
solana-pubkey = "=4.1.0"
solana-program-error = "=3.0.1"
